version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: travelai-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - DATABASE_URL=postgresql://travelai:travelai123@postgres:5432/travelaidb
      - SECRET_KEY=travelai-production-super-secret-key-32-chars-minimum
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./app:/app/app

  postgres:
    image: postgres:15-alpine
    container_name: travelai-postgres
    restart: always
    environment:
      POSTGRES_USER: travelai
      POSTGRES_PASSWORD: travelai123
      POSTGRES_DB: travelaidb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travelai -d travelaidb"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
